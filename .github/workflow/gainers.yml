{
"name": "NSE 10%+ Gainers",
"on": {
"schedule": [ { "cron": "5 10 * * 1-5" } ],
"workflow_dispatch": {}
},
"jobs": {
"scan": {
"runs-on": "ubuntu-latest",
"timeout-minutes": 10,
"steps": [
{ "name": "Get the code", "uses": "actions/checkout@v4" },
{ "name": "Show what is actually in the repo", "run": "ls -la" },
{ "name": "Set up Python", "uses": "actions/setup-python@v5", "with": { "python-version": "3.12" } },
{ "name": "Install dependencies", "run": "pip install requests" },
{ "name": "Run scan and send Telegram alert",
"env": {
"TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
"TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
},
"run": "python main.py" }
]
}
}
}
