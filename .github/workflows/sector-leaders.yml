{
  "name": "NSE Mid/Small Sector Leaders",
  "on": {
    "schedule": [
      {
        "cron": "0 4 * * 1-5"
      },
      {
        "cron": "20 4 * * 1-5"
      }
    ],
    "workflow_dispatch": {}
  },
  "jobs": {
    "sector-leaders": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repo",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install --upgrade pip && pip install requests yfinance pandas"
        },
        {
          "name": "Run sector scan",
          "run": "python sector_leaders.py",
          "env": {
            "TELEGRAM_BOT_TOKEN": "${{ secrets.SECTOR_BOT_TOKEN }}",
            "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "TOP_SECTORS": "4",
            "TOP_STOCKS": "5",
            "MIN_GROUP": "4",
            "MIN_VOLUME": "100000",
            "MIN_3M_GAIN": "25",
            "TOP_MOMENTUM": "10",
            "SHOW_LAGGARDS": "1",
            "SKIP_IF_CLOSED": "1"
          }
        }
      ]
    }
  }
}
